[package]
name = "hashify"
version = "0.3.1"
description = "Fast perfect hashing without dependencies"
edition = "2024"
rust-version = "1.88"
authors = [ "Stalwart Labs <hello@stalw.art>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/stalwartlabs/hashify"
homepage = "https://github.com/stalwartlabs/hashify"
keywords = ["hash", "perfect", "minimal"]
categories = ["data-structures", "no-std"]
readme = "README.md"
resolver = "2"
exclude = ["/benches", "/examples"]

[lib]
proc-macro = true
doctest = false

[dependencies]
syn = { version = "3.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
criterion = "0.8"
phf = { version = "0.14.0", features = ["macros"] }
synthetic-keys = { path = "benches/synthetic-keys" }

[[bench]]
name = "lookup"
harness = false
